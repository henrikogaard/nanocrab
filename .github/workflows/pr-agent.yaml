name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-agent:
    # Automatic reviews run for PR events. Manual /review comments are limited
    # to trusted repository collaborators and PRs; arbitrary issue comments
    # must not start a secret-bearing self-hosted job.
    if: |
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          startsWith(github.event.comment.body, '/review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: devbox
    steps:
      # The action reads the PR through GitHub's API. Do not check out an
      # untrusted PR onto the self-hosted runner.
      - uses: the-pr-agent/pr-agent@6ad7cf75d95cb3bbb54cf2ad92050eb03804964a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.QWEN_API_BASE }}
          CONFIG__MODEL: "openai/Qwen3.6"
          CONFIG__FALLBACK_MODELS: '["openai/Qwen3.6"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
