name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-agent:
    if: github.event.sender.type != 'Bot'
    runs-on: devbox
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.QWEN_API_BASE }}
          CONFIG__MODEL: "openai/Qwen3.6"
          CONFIG__FALLBACK_MODELS: '["openai/Qwen3.6"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
