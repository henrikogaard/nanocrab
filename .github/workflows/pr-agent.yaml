name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-agent:
    if: github.event.sender.type != 'Bot'
    runs-on: devbox
    permissions:
      issues: write
      pull-requests: write
      contents: read
      checks: write
    steps:
      - uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.QWEN_API_BASE }}
          config.model: "openai/Qwen3.6"
          config.fallback_models: '["openai/Qwen3.6"]'
          config.custom_model_max_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
