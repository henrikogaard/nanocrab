<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoCrab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: oklch(17% 0.018 250);
        color: oklch(94% 0.009 250);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        text-align: center;
        padding: 40px;
        position: relative;
        z-index: 1;
      }
      .avatar {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        object-fit: contain;
        padding: 24px;
        background: oklch(21% 0.018 250);
        border: 1px solid oklch(31% 0.022 250);
        margin-bottom: 32px;
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .avatar:hover {
        transform: translateY(-2px);
        border-color: oklch(68% 0.115 222);
      }
      h1 {
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 8px;
        color: oklch(94% 0.009 250);
      }
      .tagline {
        font-size: 16px;
        color: oklch(76% 0.022 250);
        margin-bottom: 40px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        background: color-mix(in oklch, oklch(72% 0.14 154) 12%, transparent);
        border: 1px solid color-mix(in oklch, oklch(72% 0.14 154) 32%, transparent);
        border-radius: 999px;
        font-family:
          ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        color: oklch(72% 0.14 154);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: oklch(72% 0.14 154);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="/static/nanocrab-mark.png"
        alt="NanoCrab logo"
        class="avatar"
        onerror="this.style.display = 'none'"
      />
      <h1 id="name">NanoCrab</h1>
      <p class="tagline">Personal AI Assistant</p>
      <div class="status">
        <span class="status-dot"></span>
        Online
      </div>
    </div>
    <script>
      fetch('/health')
        .then((r) => r.json())
        .then((d) => {
          if (!d.status || d.status === 'degraded') {
            document.querySelector('.status').style.background =
              'rgba(239,68,68,0.08)';
            document.querySelector('.status').style.borderColor =
              'rgba(239,68,68,0.2)';
            document.querySelector('.status').style.color = '#ef4444';
            document.querySelector('.status-dot').style.background = '#ef4444';
            document.querySelector('.status').lastChild.textContent =
              ' Degraded';
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
