<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NanoCrab Focus Stack comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #050b10;
        color: #dce9f1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .comparison {
        display: flex;
        width: max-content;
        background: #050b10;
      }
      .panel {
        flex: 0 0 auto;
        border-right: 1px solid #26404d;
      }
      .label {
        display: flex;
        align-items: center;
        height: 40px;
        padding: 0 16px;
        border-bottom: 1px solid #26404d;
        background: #0d171e;
        color: #65d6ff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .full-panel {
        width: 1440px;
      }
      .full-frame {
        width: 1440px;
        height: 1000px;
        overflow: hidden;
      }
      .normalized-image {
        display: block;
        width: 1440px;
        height: 1000px;
        object-fit: cover;
        object-position: center;
      }
      .header-frame {
        width: 1440px;
        height: 430px;
        overflow: hidden;
      }
      .crop-panel {
        width: 780px;
      }
      .content-frame {
        position: relative;
        width: 780px;
        height: 600px;
        overflow: hidden;
      }
      .content-frame .normalized-image {
        position: absolute;
        top: -150px;
        left: -350px;
      }
    </style>
  </head>
  <body>
    <div class="comparison" id="full-comparison">
      <section class="panel full-panel">
        <div class="label">Source target · normalized to 1440 × 1000</div>
        <div class="full-frame">
          <img
            class="normalized-image"
            src="approved-focus-stack-target.png"
            alt="Approved NanoCrab Focus Stack source target"
          />
        </div>
      </section>
      <section class="panel full-panel">
        <div class="label">Implementation · Reports · inspector open</div>
        <div class="full-frame">
          <img
            class="normalized-image"
            src="desktop-reports-inspector-open.png"
            alt="Rendered NanoCrab Reports implementation with inspector open"
          />
        </div>
      </section>
    </div>

    <div class="comparison" id="header-comparison">
      <section class="panel full-panel">
        <div class="label">
          Source · shell, navigation, typography, inspector
        </div>
        <div class="header-frame">
          <img
            class="normalized-image"
            src="approved-focus-stack-target.png"
            alt="Approved source shell crop"
          />
        </div>
      </section>
      <section class="panel full-panel">
        <div class="label">
          Implementation · shell, navigation, typography, inspector
        </div>
        <div class="header-frame">
          <img
            class="normalized-image"
            src="desktop-reports-inspector-open.png"
            alt="Rendered implementation shell crop"
          />
        </div>
      </section>
    </div>

    <div class="comparison" id="content-comparison">
      <section class="panel crop-panel">
        <div class="label">Source · primary work and action hierarchy</div>
        <div class="content-frame">
          <img
            class="normalized-image"
            src="approved-focus-stack-target.png"
            alt="Approved source primary content crop"
          />
        </div>
      </section>
      <section class="panel crop-panel">
        <div class="label">
          Implementation · primary work and action hierarchy
        </div>
        <div class="content-frame">
          <img
            class="normalized-image"
            src="desktop-reports-inspector-open.png"
            alt="Rendered implementation primary content crop"
          />
        </div>
      </section>
    </div>
  </body>
</html>
